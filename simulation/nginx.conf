# nginx fronting the Drogon sim binary inside the simulation container.
# Listens on the external port (8848) and proxies to Drogon on 127.0.0.1:8849.
server {
    listen 8848;
    server_name _;

    # REST control plane. Trailing slashes strip the /api prefix so Drogon keeps
    # its existing unprefixed routes (/status/all, /satellite, /delay, /stream/rate).
    location /api/ {
        proxy_pass http://127.0.0.1:8849/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket data plane. The Upgrade/Connection headers are what make WebSocket
    # proxying work; the long read timeout keeps idle streams open.
    location /ws/ {
        proxy_pass http://127.0.0.1:8849/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
